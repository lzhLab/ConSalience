seed: 2024

model:
  name: UNet3D
  in_channels: 1
  out_channels: 1
  base_channels: 16

data:
  dataset: 3Dircadb1
  root_dir: data/preprocessed
  split_path: data/preprocessed/splits.json
  use_salience: false

train:
  epochs: 100
  batch_size: 1
  lr: 0.001
  weight_decay: 0.0001
  num_workers: 4
  save_dir: checkpoints/unet3d_3dircadb1

loss:
  bce_weight: 0.5
  dice_weight: 0.5

val:
  threshold: 0.5

salience:
  K: 1
  delta_theta: 90
  delta_sigma: 1.0

